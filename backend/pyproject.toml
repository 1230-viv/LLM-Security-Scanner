[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-security-scanner-backend"
version = "0.1.0"
description = "Production-ready backend for LLM Security Scanner"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.42",
  "asyncpg>=0.30.0",
  "httpx>=0.28.1",
  "python-json-logger>=2.0.7",
  "cryptography>=45.0.0",
  "tenacity>=9.1.2",
  "typer>=0.16.0",
  "rich>=14.0.0",
  "python-multipart>=0.0.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "mypy>=1.17.0",
  "hypothesis>=6.138.0"
]

[project.scripts]
llm-scanner = "app.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
